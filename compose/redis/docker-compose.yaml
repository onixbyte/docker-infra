# Docker Compose file for Redis (Alpine)
#
# Usage:
#   docker compose up -d
#
# By default, Redis starts with no password — any client can connect.
# To require a password, set REDIS_PASSWORD in your .env file and uncomment
# the "command" line below. Clients must then authenticate with AUTH
# <password>.
#
# Environment variables (see .env.example for details):
#   REDIS_PASSWORD - Optional password for client connections

services:
  redis:
    # For available image tags, see https://hub.docker.com/_/redis
    image: redis:8-alpine
    container_name: redis
    # To enable password authentication, set REDIS_PASSWORD in your .env file
    # and uncomment the following line:
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      # Map host port 6379 to container port 6379 (Redis default).
      - "6379:6379"
    volumes:
      # Persist data beyond container lifetime.
      - redis_data:/data

volumes:
  redis_data:
